<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 唐詩朗讀小學堂 🌟</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 標楷體為主，最適合兒童識字 */
        body {
            font-family: 'BiauKai', 'KaiTi', 'DFKai-SB', '標楷體', serif;
            background-color: #fffbeb; /* 溫暖的淺黃色背景 */
        }

        .ui-font {
            font-family: 'Nunito', 'Microsoft JhengHei', sans-serif;
        }

        /* 句子朗讀時的整行高亮 */
        .highlight-reading {
            background-color: #fef08a !important; 
            border-radius: 0.75rem;
            transform: scale(1.02);
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* 單字點讀筆：滑鼠懸停效果 */
        .clickable-char {
            position: relative;
            display: inline-block;
            cursor: pointer;
            padding: 0 2px; /* 取代 letter-spacing，讓點擊範圍更準確 */
            transition: color 0.2s, transform 0.2s;
        }
        .clickable-char:hover {
            color: #ea580c; /* 橘色 */
            transform: scale(1.15) translateY(-2px);
        }

        /* 單字點讀筆：朗讀中的高亮特效 */
        .char-playing {
            color: #ef4444 !important; /* 紅色 */
            font-weight: 900;
            transform: scale(1.2);
            text-shadow: 0 4px 8px rgba(239, 68, 68, 0.3);
        }

        /* 單字點讀筆：提示氣泡 (模擬注音/解釋彈窗) */
        .char-tooltip {
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%) translateY(5px) scale(0.8);
            background-color: #3b82f6; /* 藍色氣泡 */
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Nunito', sans-serif;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55); /* 彈跳動畫 */
            z-index: 20;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* 氣泡的小尾巴 */
        .char-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #3b82f6 transparent transparent transparent;
        }

        .show-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        /* 句子動畫過渡 */
        .poem-line {
            transition: all 0.2s ease-in-out;
        }

        /* 自訂滑桿樣式 */
        input[type=range] {
            accent-color: #10b981; /* 翡翠綠 */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4 md:py-10">

    <!-- 標題 -->
    <header class="text-center mb-6">
        <h1 class="text-4xl md:text-5xl font-bold text-emerald-600 ui-font flex items-center justify-center gap-3 shadow-sm bg-white py-4 px-8 rounded-full border-4 border-emerald-200">
            <i class="fa-solid fa-graduation-cap text-orange-400"></i>
            唐詩朗讀小學堂
        </h1>
        <p class="text-lg text-emerald-700 mt-4 ui-font font-medium">哪裡不會點哪裡，跟著烏龜兔子學朗讀！</p>
    </header>

    <!-- 語速控制台 (烏龜與兔子) -->
    <div class="bg-white p-4 md:px-8 rounded-2xl shadow-md border-2 border-emerald-100 flex flex-col md:flex-row items-center gap-4 mb-8 w-full max-w-2xl ui-font">
        <div class="flex items-center gap-2 text-gray-700 font-bold mr-auto">
            <i class="fa-solid fa-gauge-high text-emerald-500"></i>
            <span>朗讀速度：</span>
        </div>
        <div class="flex items-center gap-3 w-full md:w-auto">
            <span class="text-3xl cursor-help hover:scale-110 transition-transform" title="烏龜（慢速）">🐢</span>
            <input type="range" id="rate-slider" min="0.5" max="1.5" step="0.05" value="0.85" 
                   class="w-full md:w-48 h-3 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            <span class="text-3xl cursor-help hover:scale-110 transition-transform" title="兔子（快速）">🐇</span>
        </div>
        <span id="rate-display" class="font-bold text-emerald-600 w-12 text-right text-lg">0.85x</span>
    </div>

    <!-- 詩詞選擇選單 (Tabs) -->
    <nav class="flex flex-wrap justify-center gap-3 md:gap-4 mb-8 ui-font max-w-3xl" id="poem-tabs">
        <!-- 動態生成標籤 -->
    </nav>

    <!-- 詩詞顯示與互動區域 -->
    <main class="w-full max-w-3xl bg-white rounded-3xl shadow-xl p-6 md:p-10 border-4 border-yellow-200 relative">
        <!-- 裝飾 -->
        <div class="absolute -top-6 -left-6 text-6xl text-yellow-300 drop-shadow-md transform -rotate-12 pointer-events-none">
            <i class="fa-solid fa-sun"></i>
        </div>
        <div class="absolute -bottom-4 -right-4 text-5xl text-emerald-300 drop-shadow-md transform rotate-12 pointer-events-none">
            <i class="fa-solid fa-leaf"></i>
        </div>

        <div id="poem-content" class="flex flex-col items-center">
            <!-- 動態生成詩詞內容 -->
        </div>
    </main>

    <!-- 錯誤提示 -->
    <div id="error-msg" class="hidden mt-6 bg-red-100 text-red-700 px-6 py-3 rounded-lg ui-font">
        <i class="fa-solid fa-triangle-exclamation mr-2"></i>
        您的瀏覽器不支援語音功能，請使用最新版的 Chrome、Edge 或 Safari。
    </div>

    <script>
        // --- 狀態與設定 ---
        let currentRate = 0.85; // 預設語速
        let activeLineId = null;
        let activeCharId = null;

        // 綁定語速滑桿
        const rateSlider = document.getElementById('rate-slider');
        const rateDisplay = document.getElementById('rate-display');
        
        rateSlider.addEventListener('input', (e) => {
            currentRate = parseFloat(e.target.value);
            rateDisplay.innerText = currentRate.toFixed(2) + 'x';
            // 若滑動時正在播放，立即停止
            window.speechSynthesis.cancel();
        });

        // 唐詩資料庫
        const poems = [
            { id: 'chun-xiao', title: '春曉', author: '孟浩然', icon: 'fa-seedling', color: 'bg-green-500 hover:bg-green-600',
              lines: ['春眠不覺曉，', '處處聞啼鳥。', '夜來風雨聲，', '花落知多少。'] },
            { id: 'jing-ye-si', title: '靜夜思', author: '李白', icon: 'fa-moon', color: 'bg-indigo-500 hover:bg-indigo-600',
              lines: ['床前明月光，', '疑是地上霜。', '舉頭望明月，', '低頭思故鄉。'] },
            { id: 'deng-guan-que-lou', title: '登鸛雀樓', author: '王之渙', icon: 'fa-mountain-sun', color: 'bg-orange-500 hover:bg-orange-600',
              lines: ['白日依山盡，', '黃河入海流。', '欲窮千里目，', '更上一層樓。'] },
            { id: 'yong-e', title: '詠鵝', author: '駱賓王', icon: 'fa-feather', color: 'bg-blue-500 hover:bg-blue-600',
              lines: ['鵝、鵝、鵝，', '曲項向天歌。', '白毛浮綠水，', '紅掌撥清波。'] },
            { id: 'xiang-si', title: '相思', author: '王維', icon: 'fa-heart', color: 'bg-red-500 hover:bg-red-600',
              lines: ['紅豆生南國，', '春來發幾枝。', '願君多採擷，', '此物最相思。'] }
        ];

        if (!('speechSynthesis' in window)) {
            document.getElementById('error-msg').classList.remove('hidden');
        }

        // --- 核心功能：朗讀整句 (Teacher Voice) ---
        function playTeacherVoice(text, elementId) {
            window.speechSynthesis.cancel();
            
            // 清除之前的單字高亮 (如果有的話)
            resetAllHighlights();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = currentRate; // 使用滑桿決定的語速
            utterance.pitch = 1.1; // 聲音較具活力

            const targetElement = document.getElementById(elementId);

            utterance.onstart = () => {
                targetElement.classList.add('highlight-reading');
                activeLineId = elementId;
            };

            utterance.onend = () => {
                targetElement.classList.remove('highlight-reading');
                activeLineId = null;
            };

            utterance.onerror = () => {
                targetElement.classList.remove('highlight-reading');
            };

            window.speechSynthesis.speak(utterance);
        }

        // --- 核心功能：點讀筆 (朗讀單一中文字) ---
        function playSingleChar(char, elementId, event) {
            // 防止點擊事件冒泡觸發行的高亮或其他事件
            if(event) event.stopPropagation();

            window.speechSynthesis.cancel();
            resetAllHighlights();

            const utterance = new SpeechSynthesisUtterance(char);
            utterance.lang = 'zh-TW';
            utterance.rate = currentRate; 
            utterance.pitch = 1.2; // 單字讀音稍微提高音高，引起注意

            const targetElement = document.getElementById(elementId);
            
            // 處理提示氣泡
            let tooltip = targetElement.querySelector('.char-tooltip');
            if (!tooltip) {
                tooltip = document.createElement('div');
                tooltip.className = 'char-tooltip';
                tooltip.innerHTML = `<i class="fa-solid fa-bullhorn mr-1"></i> ${char}`; // 顯示小喇叭和文字
                targetElement.appendChild(tooltip);
            }

            utterance.onstart = () => {
                targetElement.classList.add('char-playing');
                tooltip.classList.add('show-tooltip');
                activeCharId = elementId;
            };

            utterance.onend = () => {
                targetElement.classList.remove('char-playing');
                tooltip.classList.remove('show-tooltip');
                activeCharId = null;
            };

            utterance.onerror = () => {
                targetElement.classList.remove('char-playing');
                if(tooltip) tooltip.classList.remove('show-tooltip');
            };

            window.speechSynthesis.speak(utterance);
        }

        // 清除所有高亮狀態的輔助函數
        function resetAllHighlights() {
            if (activeLineId && document.getElementById(activeLineId)) {
                document.getElementById(activeLineId).classList.remove('highlight-reading');
            }
            if (activeCharId && document.getElementById(activeCharId)) {
                const el = document.getElementById(activeCharId);
                el.classList.remove('char-playing');
                const tooltip = el.querySelector('.char-tooltip');
                if (tooltip) tooltip.classList.remove('show-tooltip');
            }
        }

        // --- 畫面渲染 ---

        // 將字串拆分為帶有單字點擊功能的 HTML
        function wrapCharacters(text, prefixId) {
            let html = '';
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                // 過濾標點符號，不給點讀功能
                if (/[，。、！？：；]/.test(char)) {
                    html += `<span class="text-3xl md:text-4xl text-gray-800 font-bold mx-1">${char}</span>`;
                } else {
                    const charId = `char-${prefixId}-${i}`;
                    // 綁定 onClick 事件觸發 playSingleChar
                    html += `<span id="${charId}" class="clickable-char text-4xl md:text-5xl text-gray-900 font-bold mx-1 md:mx-2" 
                                onclick="playSingleChar('${char}', '${charId}', event)">${char}</span>`;
                }
            }
            return html;
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('poem-tabs');
            tabsContainer.innerHTML = '';
            poems.forEach((poem, index) => {
                const btn = document.createElement('button');
                btn.className = `${poem.color} text-white px-5 py-3 rounded-full font-bold text-lg shadow-md transition-all transform hover:scale-105 active:scale-95 flex items-center gap-2 border-2 border-transparent hover:border-white`;
                btn.innerHTML = `<i class="fa-solid ${poem.icon}"></i> ${poem.title}`;
                btn.onclick = () => renderPoem(index);
                tabsContainer.appendChild(btn);
            });
        }

        function renderPoem(index) {
            window.speechSynthesis.cancel();
            resetAllHighlights();

            const poem = poems[index];
            const contentContainer = document.getElementById('poem-content');
            
            let html = `
                <!-- 標題與作者區域 -->
                <div class="text-center border-b-2 border-yellow-200 pb-6 mb-6 w-full relative">
                    <div id="title-container" class="inline-flex items-center justify-center gap-4 px-6 py-3 poem-line bg-transparent">
                        <div class="flex">
                            ${wrapCharacters(poem.title, 'title')}
                        </div>
                        <button onclick="playTeacherVoice('${poem.title}，作者：${poem.author}', 'title-container')" 
                                class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 rounded-full w-12 h-12 flex items-center justify-center shadow-lg transition-transform hover:scale-110 focus:outline-none ml-2"
                                title="聽老師唸標題">
                            <i class="fa-solid fa-volume-high text-xl"></i>
                        </button>
                    </div>
                    <p class="text-2xl text-gray-600 mt-4 tracking-widest">唐 · ${wrapCharacters(poem.author, 'author')}</p>
                </div>

                <!-- 詩句區域 -->
                <div class="flex flex-col gap-5 items-center w-full">
            `;

            poem.lines.forEach((line, lineIndex) => {
                const lineId = `line-${lineIndex}`;
                const textToSpeak = line.replace(/[，。、]/g, ''); // 整句朗讀時去除標點

                html += `
                    <div id="${lineId}" class="poem-line flex flex-wrap items-center justify-between md:justify-center gap-4 w-full md:w-5/6 lg:w-3/4 px-4 py-4 rounded-2xl border border-transparent hover:bg-yellow-50">
                        <div class="flex flex-wrap justify-center flex-1">
                            ${wrapCharacters(line, `l${lineIndex}`)}
                        </div>
                        
                        <button onclick="playTeacherVoice('${textToSpeak}', '${lineId}')" 
                                class="bg-blue-100 hover:bg-blue-200 border-2 border-blue-300 text-blue-700 rounded-full w-14 h-14 flex items-center justify-center shadow-sm transition-transform hover:scale-110 flex-shrink-0 focus:outline-none"
                                title="聽老師唸這一句">
                            <i class="fa-solid fa-play text-xl ml-1"></i>
                        </button>
                    </div>
                `;
            });

            html += `</div>`;
            contentContainer.innerHTML = html;
        }

        window.onload = () => {
            renderTabs();
            renderPoem(0);
        };
    </script>
</body>
</html>
